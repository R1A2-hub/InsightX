name: Build InsightX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. Install project dependencies
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # 4. Install react-is required by Recharts
      - name: Install missing Recharts dependency
        run: npm install react-is --legacy-peer-deps

      # 5. Build web app and sync Capacitor Android project
      - name: Build and sync Android
        run: npm run android:sync

      # 6. Setup Java
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 7. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 8. Build Debug APK
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      # 9. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InsightX-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
