name: Build InsightX APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout project
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Node.js 22
      # Capacitor requires Node.js >= 22
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # 3. Install project dependencies
      - name: Install dependencies
        run: npm install --legacy-peer-deps

      # 4. Install react-is required by Recharts
      - name: Install Recharts dependency
        run: npm install react-is --legacy-peer-deps

      # 5. Build web app and sync Capacitor Android
      - name: Build and sync Android
        run: npm run android:sync

      # 6. Setup Java 21
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # 7. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      # 8. Install required Android SDK packages
      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"

      # 9. Give Gradle wrapper execute permission
      - name: Make Gradle executable
        working-directory: android
        run: chmod +x gradlew

      # 10. Build Debug APK
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug

      # 11. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: InsightX-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
